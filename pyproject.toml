[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shifters"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.2",
    "geojson>=3.1.0",
    "graphviz>=0.21",
    "matplotlib>=3.10.7",
    "mesa>=3.3.1",
    "mesa-viz-tornado>=0.1.3",
    "networkx>=3.5",
    "pydantic>=2.12.4",
    "pyproj>=3.6.1",
    "shapely>=2.0.2",
    "solara>=1.54.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shifters*"]
exclude = ["tracks*", "examples*", "docs*"]
